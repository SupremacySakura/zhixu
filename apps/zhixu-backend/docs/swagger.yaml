definitions:
  dto.CreatePickUpCodeReq:
    properties:
      code:
        type: string
      expire_time:
        type: string
      file_id:
        type: integer
      folder_id:
        type: integer
      max_downloads:
        type: integer
      type:
        $ref: '#/definitions/model.PickUpTargetType'
    type: object
  dto.CreatePublicShareLinkReq:
    properties:
      file_id:
        minimum: 1
        type: integer
    required:
    - file_id
    type: object
  dto.DashboardFileStatItem:
    properties:
      count:
        type: integer
      size:
        type: integer
      type:
        type: string
    type: object
  dto.DashboardOverviewResp:
    properties:
      file_stats:
        items:
          $ref: '#/definitions/dto.DashboardFileStatItem'
        type: array
      storage_left:
        type: integer
      storage_total:
        type: integer
      storage_used:
        type: integer
      storage_used_percent:
        type: integer
    type: object
  dto.DeleteFileReq:
    properties:
      delete_knowledge:
        type: boolean
      file_id:
        minimum: 1
        type: integer
      folder_id:
        minimum: 1
        type: integer
    type: object
  dto.FileListItem:
    properties:
      file_type:
        type: string
      id:
        type: integer
      name:
        type: string
      size:
        type: integer
      type:
        description: file / folder
        type: string
      updated_at:
        type: string
    type: object
  dto.InitUploadFileReq:
    properties:
      chunk_size:
        minimum: 1
        type: integer
      file_hash:
        type: string
      file_name:
        type: string
      file_size:
        minimum: 1
        type: integer
      file_type:
        type: string
      folder_id:
        type: integer
      total_chunks:
        minimum: 1
        type: integer
    required:
    - chunk_size
    - file_hash
    - file_name
    - file_size
    - file_type
    - total_chunks
    type: object
  dto.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  dto.MakeDirectoryReq:
    properties:
      folder_id:
        type: integer
      name:
        type: string
    type: object
  dto.MergeUploadedChunksReq:
    properties:
      task_id:
        minimum: 1
        type: integer
    required:
    - task_id
    type: object
  dto.MoveFileReq:
    properties:
      file_id:
        minimum: 1
        type: integer
      folder_id:
        minimum: 1
        type: integer
      target_folder_id:
        type: integer
    type: object
  dto.RegisterUserReq:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  dto.RenameFileReq:
    properties:
      file_id:
        minimum: 1
        type: integer
      folder_id:
        minimum: 1
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  handler.AddKnowledgeRequest:
    properties:
      file_id:
        type: integer
      title:
        type: string
    required:
    - file_id
    type: object
  handler.DeleteAIProviderRequest:
    properties:
      expected_version:
        type: integer
    type: object
  handler.conversationRenameInput:
    properties:
      title:
        maxLength: 200
        type: string
    required:
    - title
    type: object
  model.KnowledgeItem:
    properties:
      chunks_failed:
        type: integer
      chunks_ready:
        type: integer
      chunks_total:
        type: integer
      content:
        type: string
      created_at:
        type: string
      embedding_model:
        type: string
      embedding_version:
        type: integer
      error_code:
        type: string
      error_message:
        type: string
      id:
        type: integer
      imported_at:
        type: string
      source_file_id:
        type: integer
      source_file_name:
        type: string
      source_folder_id:
        type: integer
      source_folder_name:
        type: string
      source_type:
        type: string
      status:
        $ref: '#/definitions/model.KnowledgeStatus'
      title:
        type: string
      updated_at:
        type: string
      vector_error:
        type: string
      vector_state:
        $ref: '#/definitions/model.VectorState'
    type: object
  model.KnowledgeStatus:
    enum:
    - pending
    - running
    - ready
    - failed
    type: string
    x-enum-varnames:
    - KnowledgePending
    - KnowledgeRunning
    - KnowledgeReady
    - KnowledgeFailed
  model.OperationLogAction:
    enum:
    - upload
    - upload_instant
    - mkdir
    - rename
    - move
    - delete
    - download
    - preview
    - share_link_create
    - share_link_delete
    - pickup_code_create
    - pickup_code_delete
    type: string
    x-enum-comments:
      OperationLogActionDelete: 删除
      OperationLogActionDownload: 下载
      OperationLogActionMkdir: 新建文件夹
      OperationLogActionMove: 移动
      OperationLogActionPickupCodeCreate: 创建取件码
      OperationLogActionPickupCodeDelete: 删除取件码
      OperationLogActionPreview: 预览
      OperationLogActionRename: 重命名
      OperationLogActionShareLinkCreate: 创建分享链接
      OperationLogActionShareLinkDelete: 删除分享链接
      OperationLogActionUpload: 分片上传完成
      OperationLogActionUploadInstant: 秒传（命中已有文件）
    x-enum-descriptions:
    - 分片上传完成
    - 秒传（命中已有文件）
    - 新建文件夹
    - 重命名
    - 移动
    - 删除
    - 下载
    - 预览
    - 创建分享链接
    - 删除分享链接
    - 创建取件码
    - 删除取件码
    x-enum-varnames:
    - OperationLogActionUpload
    - OperationLogActionUploadInstant
    - OperationLogActionMkdir
    - OperationLogActionRename
    - OperationLogActionMove
    - OperationLogActionDelete
    - OperationLogActionDownload
    - OperationLogActionPreview
    - OperationLogActionShareLinkCreate
    - OperationLogActionShareLinkDelete
    - OperationLogActionPickupCodeCreate
    - OperationLogActionPickupCodeDelete
  model.OperationLogTargetType:
    enum:
    - file
    - folder
    type: string
    x-enum-varnames:
    - OperationLogTargetTypeFile
    - OperationLogTargetTypeFolder
  model.PickUpCodeStatus:
    enum:
    - Active
    - Expired
    type: string
    x-enum-varnames:
    - PickUpCodeStatusActive
    - PickUpCodeStatusExpire
  model.PickUpTargetType:
    enum:
    - file
    - folder
    type: string
    x-enum-varnames:
    - PickUpTargetTypeFile
    - PickUpTargetTypeFolder
  model.ProviderModel:
    properties:
      created_at:
        type: string
      dimension:
        type: integer
      id:
        type: integer
      kind:
        type: string
      model_id:
        type: string
      provider_id:
        type: integer
      updated_at:
        type: string
    type: object
  model.UploadStatus:
    enum:
    - uploading
    - merging
    - completed
    type: string
    x-enum-varnames:
    - UploadStatusUploading
    - UploadStatusMerging
    - UploadStatusCompleted
  model.UserAISettings:
    properties:
      chat_model_id:
        type: integer
      config_version:
        type: integer
      embedding_model_id:
        type: integer
      embedding_version:
        type: integer
      needs_reindex:
        type: boolean
      rag_min_score:
        type: number
      rag_top_k:
        type: integer
      updated_at:
        type: string
    type: object
  model.VectorState:
    enum:
    - pending
    - running
    - ready
    - partial
    type: string
    x-enum-varnames:
    - VectorPending
    - VectorRunning
    - VectorReady
    - VectorPartial
  response.Response:
    properties:
      code:
        $ref: '#/definitions/response.ResponseCode'
      data: {}
      msg:
        type: string
    type: object
  response.ResponseCode:
    enum:
    - 0
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    type: integer
    x-enum-varnames:
    - CodeSuccess
    - CodeInvalidParam
    - CodeUnauthorized
    - CodeNotFound
    - CodeServerError
    - CodeConflict
  service.AIConfigView:
    properties:
      providers:
        items:
          $ref: '#/definitions/service.ProviderView'
        type: array
      settings:
        $ref: '#/definitions/model.UserAISettings'
    type: object
  service.ChatInput:
    properties:
      conversation_id:
        description: |-
          ConversationID, when set, continues an existing Mastra thread; when empty the
          backend starts a new thread and returns its id in the meta event. Title seeds the
          new thread (first user message, truncated) so the AI service never spends a model
          call on title generation.
        type: string
      messages:
        items:
          $ref: '#/definitions/service.ChatMessage'
        type: array
      model_id:
        type: integer
      rag:
        type: boolean
      title:
        type: string
    type: object
  service.ChatMessage:
    properties:
      content:
        type: string
      role:
        type: string
    type: object
  service.DefaultsInput:
    properties:
      chat_model_id:
        type: integer
      confirm_reindex:
        type: boolean
      embedding_model_id:
        type: integer
      expected_version:
        type: integer
      rag_min_score:
        type: number
      rag_top_k:
        description: |-
          Nil RagTopK/RagMinScore keeps the stored retrieval settings, so clients
          predating them can still save model defaults without resetting retrieval.
        type: integer
    type: object
  service.ModelInput:
    properties:
      dimension:
        type: integer
      kind:
        type: string
      model_id:
        type: string
    type: object
  service.ProviderInput:
    properties:
      api_key:
        type: string
      auth_type:
        type: string
      base_url:
        type: string
      catalog_id:
        type: string
      clear_api_key:
        type: boolean
      confirm_reindex:
        type: boolean
      expected_version:
        type: integer
      models:
        items:
          $ref: '#/definitions/service.ModelInput'
        type: array
      name:
        type: string
      protocol:
        type: string
      provider_id:
        type: string
    type: object
  service.ProviderView:
    properties:
      auth_type:
        type: string
      base_url:
        type: string
      catalog_id:
        type: string
      created_at:
        type: string
      credential_configured:
        type: boolean
      id:
        type: integer
      models:
        items:
          $ref: '#/definitions/model.ProviderModel'
        type: array
      name:
        type: string
      protocol:
        type: string
      provider_id:
        type: string
      updated_at:
        type: string
    type: object
  vo.InitUploadFileResp:
    properties:
      file_id:
        type: integer
      status:
        $ref: '#/definitions/model.UploadStatus'
      task_id:
        type: integer
      uploaded_chunks:
        items:
          type: integer
        type: array
    type: object
  vo.LoginResp:
    properties:
      token:
        type: string
    type: object
  vo.MergeUploadedChunksResp:
    properties:
      file_id:
        type: integer
      status:
        $ref: '#/definitions/model.UploadStatus'
    type: object
  vo.OperationLogListItem:
    properties:
      action:
        $ref: '#/definitions/model.OperationLogAction'
      created_at:
        type: string
      detail:
        type: string
      folder_name:
        type: string
      id:
        type: integer
      target_id:
        type: integer
      target_name:
        type: string
      target_type:
        $ref: '#/definitions/model.OperationLogTargetType'
    type: object
  vo.OperationLogListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/vo.OperationLogListItem'
        type: array
      total:
        type: integer
    type: object
  vo.PickUpCodeListItem:
    properties:
      code:
        type: string
      created_at:
        type: string
      download:
        type: integer
      expire_time:
        type: string
      file_id:
        type: integer
      folder_id:
        type: integer
      id:
        type: integer
      max_download:
        type: integer
      name:
        type: string
      status:
        $ref: '#/definitions/model.PickUpCodeStatus'
      type:
        $ref: '#/definitions/model.PickUpTargetType'
    type: object
info:
  contact: {}
paths:
  /auth/check:
    get:
      consumes:
      - application/json
      description: 验证用户是否已登录（通过JWT Token）
      produces:
      - application/json
      responses:
        "200":
          description: 已登录（code=0）
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: 未登录（code=1002）
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 检查登录状态
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: 用户通过账号密码登录
      parameters:
      - description: 登录参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 返回统一响应（code=0成功，code!=0失败；data包含token）
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/vo.LoginResp'
              type: object
      summary: 用户登录
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 用户通过用户名、邮箱、密码注册
      parameters:
      - description: 注册参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: 返回统一响应（code=0成功，code!=0失败；data可能为空）
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
      summary: 用户注册
      tags:
      - auth
  /chat:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户模型 ID 与会话
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/service.ChatInput'
      produces:
      - application/x-ndjson
      responses:
        "200":
          description: meta / delta / done / error 事件
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 临时无工具多轮对话，返回 NDJSON 流
      tags:
      - chat
  /chat/conversations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 会话列表
      tags:
      - chat
  /chat/conversations/{id}:
    delete:
      parameters:
      - description: 会话 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 删除会话
      tags:
      - chat
    get:
      parameters:
      - description: 会话 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 会话详情（含消息与知识来源）
      tags:
      - chat
    patch:
      consumes:
      - application/json
      parameters:
      - description: 会话 ID
        in: path
        name: id
        required: true
        type: string
      - description: 新标题
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/handler.conversationRenameInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 重命名会话
      tags:
      - chat
  /file/chunk:
    post:
      consumes:
      - multipart/form-data
      description: 上传文件分片
      parameters:
      - description: 上传任务ID
        in: formData
        name: task_id
        required: true
        type: integer
      - description: 分片序号
        in: formData
        name: chunk_index
        required: true
        type: integer
      - description: 分片SHA-256（省略时由服务端计算）
        in: formData
        name: chunk_hash
        type: string
      - description: 分片内容
        in: formData
        name: chunk_data
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回（code=0）
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 分片大小或哈希校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权（缺少/无效 Authorization）
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 重复分片内容冲突或任务状态冲突
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 上传文件分片
      tags:
      - file
  /file/code:
    delete:
      consumes:
      - application/json
      description: 删除指定的取件码
      parameters:
      - description: 取件码ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回（code=0）
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权（缺少/无效 Authorization）
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 权限不足
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 取件码不存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: 删除取件码
      tags:
      - file
    post:
      consumes:
      - application/json
      description: 创建分享码
      parameters:
      - description: 分享码参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePickUpCodeReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回（code=0,data=int）
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: integer
              type: object
        "401":
          description: 未授权（缺少/无效 Authorization）
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: 创建分享码
      tags:
      - file
  /file/code/count:
    get:
      consumes:
      - application/json
      description: 获取当前用户的取件码总数
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回（code=0,data=总数）
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  format: int64
                  type: integer
              type: object
        "401":
          description: 未授权（缺少/无效 Authorization）
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取取件码总数
      tags:
      - file
  /file/code/list:
    get:
      consumes:
      - application/json
      description: 分页获取当前用户的所有取件码列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        required: true
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回（code=0,data=取件码列表）
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/vo.PickUpCodeListItem'
                  type: array
              type: object
        "401":
          description: 未授权（缺少/无效 Authorization）
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取取件码列表
      tags:
      - file
  /file/dashboard/overview:
    get:
      consumes:
      - application/json
      description: 获取当前用户的空间使用、文件类型统计、最近活动
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回（code=0,data=dto.DashboardOverviewResp）
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DashboardOverviewResp'
              type: object
        "401":
          description: 未授权（缺少/无效 Authorization）
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取仪表盘概览数据
      tags:
      - file
  /file/delete:
    post:
      consumes:
      - application/json
      description: 通过 file_id 或 folder_id 删除对象（两者必须且只能传一个）
      parameters:
      - description: 删除参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteFileReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回（code=0）
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权（缺少/无效 Authorization）
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: 删除文件或文件夹
      tags:
      - file
  /file/download:
    get:
      consumes:
      - application/json
      description: 通过 file_id 下载单文件，或通过 folder_id 下载文件夹（zip）
      parameters:
      - description: 文件ID
        in: query
        name: file_id
        type: integer
      - description: 文件夹ID
        in: query
        name: folder_id
        type: integer
      produces:
      - application/octet-stream
      responses:
        "401":

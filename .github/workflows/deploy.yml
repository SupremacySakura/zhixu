name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/supremacysakura/zhixu-backend
  FRONTEND_IMAGE: ghcr.io/supremacysakura/zhixu-frontend

jobs:
  # 检查任务：此前 CI 只 build Docker 镜像，从不跑 lint/test/typecheck，
  # 导致 `apps/zhixu-ai/src/lib/evolve.ts` 的 prettier 错误从 eeb0ab2 起
  # 活了 19 个提交才被人发现。这里复用仓库自己的 verify 命令，不另造一套。
  checks:
    name: Checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/zhixu-backend/go.mod
          cache-dependency-path: apps/zhixu-backend/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint / typecheck / test / build / guards / backend)
        run: pnpm verify

  deploy:
    name: Deploy to Production
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/zhixu-backend
          file: ./apps/zhixu-backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/zhixu-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 40m
          envs: DEPLOY_DIR,BACKEND_IMAGE,FRONTEND_IMAGE,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e

            echo "Deploying to: $DEPLOY_DIR"

            # 1. 检查 .env 文件是否存在
            if [ ! -f "$DEPLOY_DIR/.env" ]; then
              echo "ERROR: .env file not found in $DEPLOY_DIR"
              ls -la "$DEPLOY_DIR" || echo "Directory does not exist or is not accessible"
              exit 1
            fi

            # 2. 进入部署目录并拉取代码
            cd "$DEPLOY_DIR"
            git pull origin main

            # 3. 拉取 GitHub Actions 构建好的镜像并重启服务
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose --profile full pull
            docker compose --profile full up -d --no-build --force-recreate

            # 4. 清理旧镜像
            docker image prune -f
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

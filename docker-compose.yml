services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: ${MYSQL_CONTAINER_NAME:-zhixu-mysql}
    profiles: ["infra", "backend", "frontend", "full"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhixu}
      MYSQL_INITDB_SKIP_TZINFO: "${MYSQL_INITDB_SKIP_TZINFO:-1}"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
      - ${MYSQL_INIT_DIR:-./ops/mysql/init}:/docker-entrypoint-initdb.d:ro
      - ${MYSQL_IMPORT_DIR:-./ops/mysql/import}:/opt/mysql-import
    networks:
      - zhixu-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.15.5}
    profiles: ["infra", "backend", "frontend", "full"]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - zhixu-network
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-zhixu-backend}:${IMAGE_TAG:-latest}
    build:
      context: ./apps/zhixu-backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-zhixu-backend}
    profiles: ["backend", "frontend", "full"]
    environment:
      PORT: ${BACKEND_CONTAINER_PORT:-9000}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456123456}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-zhixu}}
      JWT_SECRET: ${JWT_SECRET:-your_secret_key}
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      CHAT_AI_URL: ${CHAT_AI_URL:-http://host.docker.internal:4111}
      CHAT_BACKEND_URL: ${CHAT_BACKEND_URL:-http://127.0.0.1:9001}
      MODEL_ALLOWED_PRIVATE_ENDPOINTS: ${MODEL_ALLOWED_PRIVATE_ENDPOINTS:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      CHUNK_STORAGE_PATH: ${CHUNK_STORAGE_PATH:-/app/data}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH:-/app/data}
    ports:
      - "${BACKEND_HOST_PORT:-9001}:${BACKEND_CONTAINER_PORT:-9000}"
    volumes:
      - backend-data:/app/data
    networks:
      - zhixu-network
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${BACKEND_CONTAINER_PORT:-9000}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m

  frontend:
    image: ${FRONTEND_IMAGE:-zhixu-frontend}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/zhixu-frontend/Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME:-zhixu-frontend}
    profiles: ["frontend", "full"]
    environment:
      BACKEND_UPSTREAM_HOST: ${BACKEND_UPSTREAM_HOST:-backend}
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT:-9000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - zhixu-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 512m

networks:
  zhixu-network:
    name: ${NETWORK_NAME:-zhixu-network}
    driver: bridge

volumes:
  backend-data:
    name: ${BACKEND_VOLUME_NAME:-backend-data}
  qdrant-data:
    name: ${QDRANT_VOLUME_NAME:-zhixu-qdrant-data}
